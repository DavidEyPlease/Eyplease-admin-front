name: Deploy Eyplease Admin Portal

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11.1.1

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build project
        env:
          VITE_API_BASE: ${{ secrets.VITE_API_BASE }}
          VITE_API_URL: ${{ secrets.VITE_API_BASE }}/admin
          VITE_CDN_URL: ${{ secrets.VITE_CDN_URL }}
        run: pnpm run build

      # Copia directa por ssh, con el rsync que ya trae el runner. Antes iba con burnett01/rsync-deployments, que en
      # CADA corrida construye una imagen desde Docker Hub: el 9-oct-2026 Docker Hub contestó «429 Too Many Requests»
      # y el despliegue falló ocho veces seguidas con el código bien. Hace lo mismo que hacía esa acción: la llave va
      # al agente de ssh (no toca el disco) y se copian los mismos archivos, con las mismas exclusiones.
      - name: Deploy to VPS via rsync
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
          # Sin destino, rsync copiaría a la carpeta de inicio del usuario: mejor no copiar nada
          if [ -z "${VPS_DEPLOY_PATH// /}" ] || [ -z "$VPS_HOST" ] || [ -z "$VPS_USER" ]; then
            echo "Falta el destino del despliegue (VPS_DEPLOY_PATH, VPS_HOST o VPS_USER)."
            exit 1
          fi
          eval "$(ssh-agent -s)" > /dev/null
          trap 'ssh-agent -k > /dev/null' EXIT
          ssh-add - <<< "$VPS_SSH_KEY"
          rsync -avzr --exclude='.htaccess' --exclude='.env' --exclude='.well-known' \
            -e 'ssh -o StrictHostKeyChecking=no -p 22022' \
            dist/ "$VPS_USER@$VPS_HOST:$VPS_DEPLOY_PATH"
