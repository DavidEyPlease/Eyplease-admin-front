<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- El logo con el degradado de la barra (violeta a turquesa). `?v=2`: el navegador guarda el ícono
         anterior por mucho tiempo y sin cambiar la dirección seguiría enseñando el violeta plano -->
    <link rel="icon" href="/favicon.ico?v=2" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <!-- `viewport-fit=cover`: instalado como app, el panel llega hasta abajo y la barra del menú respeta la zona del gesto de inicio -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- El panel instalado como app en el teléfono (Android: «Instalar app»; iPhone: Compartir → «Agregar a inicio») -->
    <!-- `.json` y no `.webmanifest`: el servidor no conoce esa extensión y lo entregaba sin tipo de contenido -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#F3F2FA" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0B0A1A" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Eyplease Admin" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Admin | Eyplease+</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
