<!doctype html>
<html lang="es" translate="no">
  <head>
    <meta charset="UTF-8" />
    <title>El panel en teléfono (sólo dev)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- SÓLO DEV (no entra en el build): la demo del panel dentro de un marco de teléfono, para juzgar
         tamaños de toque y alcance del pulgar.  http://localhost:<puerto>/telefono.html   …?ir=/tasks -->
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; gap: 14px; padding: 18px 12px 26px; background: #0B0A1A; color: #E9E6FF; font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .barra { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; max-width: 760px; }
      .barra button { height: 34px; padding: 0 14px; border-radius: 999px; border: 1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.06); color: inherit; font: inherit; font-weight: 700; cursor: pointer; }
      .barra button[aria-pressed="true"] { background: #6C47FF; border-color: #6C47FF; }
      .telefono { width: 414px; max-width: 100%; padding: 12px; border-radius: 54px; background: #1B1930; box-shadow: 0 30px 80px -30px #000, inset 0 0 0 2px rgba(255,255,255,.08); }
      .telefono iframe { display: block; width: 390px; max-width: 100%; height: min(844px, calc(100vh - 150px)); border: 0; border-radius: 42px; background: #0B0A1A; }
      small { color: #A7A1D6; text-align: center; max-width: 520px; }
    </style>
  </head>
  <body>
    <div class="barra" id="barra"></div>
    <div class="telefono"><iframe id="marco" title="El panel en teléfono"></iframe></div>
    <small>Demo con gente y cifras de EJEMPLO. El marco mide 390 px de ancho, como un teléfono; el menú de abajo y «Más» son la navegación en teléfono.</small>
    <script>
      const PAGINAS = [['Hoy', '/dashboard'], ['Pedidos', '/tasks'], ['WhatsApp', '/whatsapp'], ['Cobranza', '/finance'], ['Clientas', '/clients'], ['Publicaciones', '/posts'], ['Reportes', '/reportes'], ['Planes', '/configurations/plans'], ['Perfil', '/profile']]
      const params = new URLSearchParams(location.search)
      const marco = document.getElementById('marco'), barra = document.getElementById('barra')
      const abrir = ruta => {
        marco.src = '/demo.html?nuevo=1&ir=' + encodeURIComponent(ruta) + (params.get('hoy') ? '&hoy=' + params.get('hoy') : '')
        barra.querySelectorAll('button[data-ruta]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.ruta === ruta)))
      }
      PAGINAS.forEach(([nombre, ruta]) => { const b = document.createElement('button'); b.textContent = nombre; b.dataset.ruta = ruta; b.onclick = () => abrir(ruta); barra.appendChild(b) })
      const recargar = document.createElement('button'); recargar.textContent = '↻ Recargar'; recargar.onclick = () => { marco.src = marco.src }; barra.appendChild(recargar)
      abrir(params.get('ir') || '/dashboard')
    </script>
  </body>
</html>
